<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#141a24"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0099ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0c8ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon Shield -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#222e3f" stroke-width="6"/>

  <!-- Geometric Crown / Shield Crest -->
  <path d="M 128 140 L 256 80 L 384 140 L 384 320 L 256 420 L 128 320 Z" 
        fill="#101824" stroke="url(#primaryGrad)" stroke-width="10" filter="url(#glow)"/>

  <!-- Inner Dynamic S-Lightning Crest -->
  <path d="M 330 180 L 220 180 L 190 240 L 300 240 L 256 340 L 180 340" 
        fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 280 180 L 330 180 L 280 250 L 330 250 L 220 370 L 246 290 L 190 290 Z"
        fill="url(#primaryGrad)" filter="url(#glow)"/>

  <!-- Crown Spikes Accents -->
  <circle cx="256" cy="115" r="8" fill="#00f0ff" />
  <circle cx="180" cy="155" r="6" fill="#00f0ff" />
  <circle cx="332" cy="155" r="6" fill="#00f0ff" />
</svg>
