<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00f0ff" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Shield Rounded -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#0c1017" stroke="#00f0ff" stroke-width="8" filter="url(#shadow)" />

  <!-- Stylized Samrat Crown & Geometric S -->
  <path d="M 128 360 L 192 160 L 256 260 L 320 160 L 384 360 Z" fill="url(#iconGlow)" />
  <circle cx="192" cy="140" r="14" fill="#00f0ff" />
  <circle cx="256" cy="235" r="14" fill="#00f0ff" />
  <circle cx="320" cy="140" r="14" fill="#00f0ff" />

  <text x="256" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">SAMRAT</text>
</svg>
