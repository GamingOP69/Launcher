plugins {
    id 'java'
    id 'application'
}

dependencies {
    implementation project(':core')

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'org.slf4j:slf4j-simple:2.0.12'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

application {
    mainClass.set('com.samrat.SamratClient')
}

jar {
    dependsOn ':core:jar'
    archiveBaseName.set('samrat-client-1.8.9')
    archiveVersion.set('')
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    manifest {
        attributes(
            'Implementation-Title': 'Samrat Swing Preview 1.8.9',
            'Implementation-Version': project.version,
            'Main-Class': 'com.samrat.SamratClient'
        )
    }
}

// Regression guard: this artifact is a Swing preview until a real Forge
// integration is implemented. Never ship metadata that claims it is a tweak.
tasks.register('verifyPreviewJar') {
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def attributes = new java.util.jar.JarFile(jarFile).withCloseable { jar ->
            jar.manifest.mainAttributes
        }
        if (attributes.getValue('Main-Class') != 'com.samrat.SamratClient') {
            throw new GradleException('Preview JAR must retain the Swing preview main class.')
        }
        if (attributes.getValue('Implementation-Title') != 'Samrat Swing Preview 1.8.9') {
            throw new GradleException('Preview JAR must be labeled as a Swing preview.')
        }
        if (attributes.getValue('TweakClass') != null || attributes.getValue('TweakOrder') != null) {
            throw new GradleException('Preview JAR must not claim a LaunchWrapper tweaker.')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyPreviewJar')
}
