name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  nightly:
    name: Nightly Automated Test & Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test Client & Core
        run: .\gradlew.bat test --no-daemon

      - name: Test Launcher Rust
        working-directory: launcher/src-tauri
        run: cargo test

      - name: Build Nightly Jars
        run: .\gradlew.bat assemble --no-daemon

      - name: Upload Nightly Client
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samrat-client-nightly-${{ github.sha }}
          path: |
            client/build/libs/*.jar
            core/build/libs/*.jar
          if-no-files-found: ignore
