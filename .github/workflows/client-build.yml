name: Client Matrix Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-forge-client:
    name: Build and Launch Forge 1.8.9 Client Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 8

      - name: Set up ForgeGradle-compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'

      - name: Install software OpenGL and X11 display support
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb x11-xserver-utils mesa-utils libgl1-mesa-dri libglx-mesa0

      - name: Run Forge Client Tests and Build
        working-directory: forge-client
        run: gradle test build --no-daemon

      - name: Upload Forge client artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-client-${{ github.sha }}
          path: forge-client/build/libs/*.jar
          retention-days: 14
          if-no-files-found: error

      - name: Test Forge asset integrity and HTTPS boundaries
        run: python scripts/test_prepare_forge_smoke_assets.py

      - name: Prepare verified Forge smoke assets over HTTPS
        run: python scripts/prepare_forge_smoke_assets.py

      - name: Launch Forge client and verify main menu
        working-directory: forge-client
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX +extension RANDR +render -noreset" bash -e -o pipefail -c '
            export LIBGL_ALWAYS_SOFTWARE=1
            xrandr --query
            glxinfo -B
            gradle runClient -x getAssets --no-daemon 2>&1 | tee forge-smoke.log
          '
          grep -Fq 'SAMRAT_SMOKE_MAIN_MENU_REACHED' forge-smoke.log

      - name: Upload Forge smoke log
        if: always() && hashFiles('forge-client/forge-smoke.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: forge-smoke-${{ github.sha }}
          path: forge-client/forge-smoke.log
          retention-days: 14
          if-no-files-found: ignore

  build-client:
    name: Build Client Jar (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 17, 21 ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Core and Client Jars (Java 8 Target)
        run: ./gradlew build --no-daemon

      - name: Upload Client Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-preview-${{ github.sha }}-jdk-${{ matrix.java }}
          path: |
            client/build/libs/*.jar
            core/build/libs/*.jar
          retention-days: 14
          if-no-files-found: error
