name: Launcher Build (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 Launcher
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: launcher
        run: npm ci

      - name: Run Rust Tests
        working-directory: launcher/src-tauri
        run: cargo test --release

      - name: Build Vite App
        working-directory: launcher
        run: npm run build

      - name: Build Tauri Desktop Bundle
        working-directory: launcher
        run: npx tauri build

      - name: Upload Launcher Binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ github.sha }}-windows-x64
          path: |
            launcher/src-tauri/target/release/bundle/msi/*.msi
            launcher/src-tauri/target/release/bundle/nsis/*.exe
            launcher/src-tauri/target/release/samrat-launcher.exe
          if-no-files-found: error
