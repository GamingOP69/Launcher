name: Launcher Build (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 Launcher
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up JDK 8 for the Forge 1.8.9 client artifact
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up ForgeGradle-compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'

      - name: Build and test the Forge client mod
        run: gradle -p forge-client test build --no-daemon

      - name: Stage Forge mod as a Tauri package resource
        shell: pwsh
        run: |
          $jar = Get-ChildItem -LiteralPath 'forge-client/build/libs' -Filter 'samrat-forge-*.jar' -File |
            Where-Object { $_.Name -notmatch '(?i)sources|dev' } |
            Select-Object -First 1
          if ($null -eq $jar) { throw 'Built Forge mod JAR was not found.' }
          $resourceDir = Join-Path 'launcher/src-tauri' 'resources'
          New-Item -ItemType Directory -Path $resourceDir -Force | Out-Null
          Copy-Item -LiteralPath $jar.FullName -Destination (Join-Path $resourceDir 'samrat-forge-1.8.9.jar') -Force

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: launcher
        run: npm ci

      - name: Run Rust Tests
        working-directory: launcher/src-tauri
        run: cargo test --locked --release

      - name: Build Vite App
        working-directory: launcher
        run: npm run build

      - name: Build Tauri Desktop Bundle
        working-directory: launcher
        run: npx tauri build

      - name: Upload Launcher Binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ github.sha }}-windows-x64
          path: |
            launcher/src-tauri/target/release/bundle/msi/*.msi
            launcher/src-tauri/target/release/bundle/nsis/*.exe
            launcher/src-tauri/target/release/samrat-launcher.exe
          if-no-files-found: error

  clean-install-smoke:
    name: Install and Start Packaged Launcher
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@v4

      - name: Set up Java 8 for the Minecraft 1.8.9 smoke
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Prepare CI-only Mesa software OpenGL target
        shell: pwsh
        run: |
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'samrat-mesa'
          New-Item -ItemType Directory -Path $mesaRoot -Force | Out-Null

      - name: Install pinned Mesa software renderer
        uses: f3d-app/install-mesa-windows-action@b78081f8331c5d49d71b221ca13a25fd97dac165
        with:
          path: ${{ runner.temp }}\samrat-mesa
          version: '24.0.5'

      - name: Load Mesa beside CI Java runtime
        shell: pwsh
        run: |
          $mesaBin = Join-Path $env:RUNNER_TEMP 'samrat-mesa'
          $javaBin = Join-Path $env:JAVA_HOME 'bin'
          foreach ($dll in @('opengl32.dll', 'libglapi.dll', 'libgallium_wgl.dll')) {
            $source = Join-Path $mesaBin $dll
            if (-not (Test-Path -LiteralPath $source)) { throw "Mesa software OpenGL runtime is missing $dll." }
            Copy-Item -LiteralPath $source -Destination (Join-Path $javaBin $dll) -Force
          }
          $env:GALLIUM_DRIVER = 'llvmpipe'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'GALLIUM_DRIVER=llvmpipe'

      - name: Download commit-specific launcher package
        uses: actions/download-artifact@v4
        with:
          name: launcher-${{ github.sha }}-windows-x64
          path: ${{ runner.temp }}\launcher-artifact

      - name: Clean-install and smoke packaged launcher
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'launcher-artifact'
          $installer = Get-ChildItem -LiteralPath $artifactRoot -Filter '*-setup.exe' -File -Recurse |
            Select-Object -First 1
          if ($null -eq $installer) { throw 'Commit-specific NSIS setup executable is missing.' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'SamratLauncherInstall'
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'SamratLauncherSmokeEvidence'
          & pwsh -NoProfile -File 'scripts/smoke_installed_launcher.ps1' `
            -InstallerPath $installer.FullName -InstallRoot $installRoot -EvidenceDirectory $evidenceRoot
          if ($LASTEXITCODE -ne 0) { throw "Packaged launcher smoke failed with exit code $LASTEXITCODE." }

      - name: Upload commit-specific package smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-smoke-${{ github.sha }}-windows-x64
          path: |
            ${{ runner.temp }}\SamratLauncherSmokeEvidence\*
          if-no-files-found: warn
