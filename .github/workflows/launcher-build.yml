name: Launcher Build (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 Launcher
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: launcher
        run: npm ci

      - name: Run Rust Tests
        working-directory: launcher/src-tauri
        run: cargo test --locked --release

      - name: Build Vite App
        working-directory: launcher
        run: npm run build

      - name: Build Tauri Desktop Bundle
        working-directory: launcher
        run: npx tauri build

      - name: Upload Launcher Binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ github.sha }}-windows-x64
          path: |
            launcher/src-tauri/target/release/bundle/msi/*.msi
            launcher/src-tauri/target/release/bundle/nsis/*.exe
            launcher/src-tauri/target/release/samrat-launcher.exe
          if-no-files-found: error

  clean-install-smoke:
    name: Install and Start Packaged Launcher
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Set up Java 8 for the Minecraft 1.8.9 smoke
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Download commit-specific launcher package
        uses: actions/download-artifact@v4
        with:
          name: launcher-${{ github.sha }}-windows-x64
          path: ${{ runner.temp }}\launcher-artifact

      - name: Install launcher and verify startup
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'launcher-artifact'
          $installer = Get-ChildItem -LiteralPath $artifactRoot -Filter '*-setup.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Commit-specific NSIS setup executable was not present in the downloaded artifact.'
          }

          $installRoot = Join-Path $env:RUNNER_TEMP 'SamratLauncherInstall'
          $installArgs = @('/S', "/D=$installRoot")
          $install = Start-Process -FilePath $installer.FullName -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer failed with exit code $($install.ExitCode)."
          }

          $app = Get-ChildItem -LiteralPath $installRoot -Filter '*.exe' -File -Recurse |
            Where-Object { $_.Name -notmatch '(?i)uninstall' } |
            Select-Object -First 1
          if ($null -eq $app) {
            throw 'Installed launcher executable was not found.'
          }

          $process = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "Installed launcher exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

          $marker = Join-Path $env:USERPROFILE '.samrat\ci-smoke-result.json'
          if (Test-Path -LiteralPath $marker) { Remove-Item -LiteralPath $marker -Force }
          $env:SAMRAT_CI_GAME_SMOKE = '1'
          $smokeLauncher = Start-Process -FilePath $app.FullName -ArgumentList @('--ci-minecraft-smoke') -PassThru
          $deadline = (Get-Date).AddMinutes(12)
          $smoke = $null
          while ((Get-Date) -lt $deadline) {
            if (Test-Path -LiteralPath $marker) {
              try { $smoke = Get-Content -LiteralPath $marker -Raw | ConvertFrom-Json } catch {}
              if ($null -ne $smoke -and $smoke.status -ne 'process_started') { break }
              if ($null -ne $smoke -and $smoke.status -eq 'process_started') { break }
            }
            $smokeLauncher.Refresh()
            if ($smokeLauncher.HasExited -and -not (Test-Path -LiteralPath $marker)) {
              throw "Packaged launcher smoke mode exited early with code $($smokeLauncher.ExitCode)."
            }
            Start-Sleep -Seconds 2
          }
          if ($null -eq $smoke -or $smoke.status -ne 'process_started') {
            throw "Packaged launcher did not start Minecraft. Smoke marker: $($smoke | ConvertTo-Json -Compress)"
          }

          $gamePid = [int]$smoke.pid
          $gameWindowSeen = $false
          $gameCommandLine = $null
          $gameDeadline = (Get-Date).AddSeconds(75)
          while ((Get-Date) -lt $gameDeadline) {
            $game = Get-CimInstance Win32_Process -Filter "ProcessId=$gamePid" -ErrorAction SilentlyContinue
            if ($null -eq $game) { throw 'Minecraft Java process exited before the window smoke passed.' }
            $gameCommandLine = $game.CommandLine
            if ($gameCommandLine -notmatch 'net\.minecraft\.client\.main\.Main') {
              throw "Started Java process was not Mojang Minecraft Main: $gameCommandLine"
            }
            $window = Get-Process -Id $gamePid -ErrorAction SilentlyContinue
            if ($null -ne $window -and $window.MainWindowTitle -match 'Minecraft') {
              $gameWindowSeen = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $gameWindowSeen) {
            throw "Minecraft 1.8.9 Java process stayed alive but its game window title was not observed. Command line: $gameCommandLine"
          }
          Write-Host "SAMRAT_MINECRAFT_WINDOW_REACHED pid=$gamePid title=$($window.MainWindowTitle)"
          Stop-Process -Id $gamePid -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $smokeLauncher.Id -Force -ErrorAction SilentlyContinue

          $uninstaller = Get-ChildItem -LiteralPath $installRoot -Filter 'uninstall.exe' -File -Recurse |
            Select-Object -First 1
          if ($null -ne $uninstaller) {
            $remove = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
            if ($remove.ExitCode -ne 0) {
              throw "NSIS uninstaller failed with exit code $($remove.ExitCode)."
            }
          }
