name: Windows Official Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Package Windows Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'launcher/package.json'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Core & Client Jars (Java 8 Target)
        shell: bash
        run: ./gradlew build --no-daemon

      - name: Install Frontend Dependencies
        working-directory: launcher
        run: npm ci

      - name: Update Cargo Dependencies to match NPM Tauri version
        working-directory: launcher
        run: cargo update --manifest-path src-tauri/Cargo.toml

      - name: Build Frontend & Tauri Bundles
        working-directory: launcher
        run: npm run tauri build

      - name: Package Dist & Generate SHA256 Checksums
        run: python scripts/package_release.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
