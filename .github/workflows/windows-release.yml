name: Windows Official Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build & Package Windows Release
    if: github.ref_protected == true && vars.ALLOW_STABLE_RELEASE == 'true' && vars.REAL_GAME_SMOKE_VERIFIED == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate protected semantic version tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -notmatch '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Stable releases require a vMAJOR.MINOR.PATCH tag."
          }

      - name: Set up JDK 8 for Forge 1.8.9 mod
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up ForgeGradle-compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'

      - name: Build and test Forge mod
        run: gradle -p forge-client test build --no-daemon

      - name: Stage Forge mod resource for Tauri release
        shell: pwsh
        run: |
          $jar = Get-ChildItem -LiteralPath 'forge-client/build/libs' -Filter 'samrat-forge-*.jar' -File |
            Where-Object { $_.Name -notmatch '(?i)sources|dev' } |
            Select-Object -First 1
          if ($null -eq $jar) { throw 'Built Forge mod JAR was not found.' }
          $resourceDir = Join-Path 'launcher/src-tauri' 'resources'
          New-Item -ItemType Directory -Path $resourceDir -Force | Out-Null
          Copy-Item -LiteralPath $jar.FullName -Destination (Join-Path $resourceDir 'samrat-forge-1.8.9.jar') -Force

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'launcher/package.json'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Core & Client Jars (Java 8 Target)
        shell: bash
        run: ./gradlew build --no-daemon

      - name: Install Frontend Dependencies
        working-directory: launcher
        run: npm ci

      - name: Build Frontend & Tauri Bundles
        working-directory: launcher
        run: npm run tauri build

      - name: Package Dist & Generate SHA256 Checksums
        run: python scripts/package_release.py

      - name: Set up Java 8 for the clean release package smoke
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Prepare CI-only Mesa software OpenGL target
        shell: pwsh
        run: |
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'samrat-mesa'
          New-Item -ItemType Directory -Path $mesaRoot -Force | Out-Null

      - name: Install pinned Mesa software renderer
        uses: f3d-app/install-mesa-windows-action@b78081f8331c5d49d71b221ca13a25fd97dac165
        with:
          path: ${{ runner.temp }}\samrat-mesa
          version: '24.0.5'

      - name: Load Mesa beside CI Java runtime
        shell: pwsh
        run: |
          $mesaBin = Join-Path $env:RUNNER_TEMP 'samrat-mesa'
          $javaBin = Join-Path $env:JAVA_HOME 'bin'
          foreach ($dll in @('opengl32.dll', 'libglapi.dll', 'libgallium_wgl.dll')) {
            $source = Join-Path $mesaBin $dll
            if (-not (Test-Path -LiteralPath $source)) { throw "Mesa software OpenGL runtime is missing $dll." }
            Copy-Item -LiteralPath $source -Destination (Join-Path $javaBin $dll) -Force
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'GALLIUM_DRIVER=llvmpipe'

      - name: Clean-install and smoke the exact release package
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath 'dist' -Filter '*-setup.exe' -File -Recurse |
            Select-Object -First 1
          if ($null -eq $installer) { throw 'Release NSIS setup executable is missing from dist.' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'SamratReleaseInstall'
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'SamratReleaseSmokeEvidence'
          & pwsh -NoProfile -File 'scripts/smoke_installed_launcher.ps1' `
            -InstallerPath $installer.FullName -InstallRoot $installRoot -EvidenceDirectory $evidenceRoot
          if ($LASTEXITCODE -ne 0) { throw "Release package smoke failed with exit code $LASTEXITCODE." }

      - name: Upload release package smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-${{ github.sha }}-windows-x64
          path: |
            ${{ runner.temp }}\SamratReleaseSmokeEvidence\*
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
