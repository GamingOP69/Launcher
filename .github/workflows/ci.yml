name: Continuous Integration

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java-test:
    name: Java Tests & Build (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 17, 21 ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Java Unit Tests
        run: ./gradlew test --no-daemon

      - name: Build All Jars (Java 8 Target Bytecode)
        run: ./gradlew build -x test --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports-jdk-${{ matrix.java-version }}
          path: |
            core/build/reports/tests/test/
            client/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore

  launcher-lint-and-typecheck:
    name: Launcher Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'launcher/package.json'

      - name: Install Frontend Dependencies
        working-directory: launcher
        run: npm ci

      - name: Run TypeScript Strict Typecheck
        working-directory: launcher
        run: npm run build

  rust-tauri-check:
    name: Rust Tauri Core Lint & Test
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            launcher/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('launcher/src-tauri/Cargo.lock', 'launcher/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-


      - name: Run Cargo Check & Clippy
        working-directory: launcher/src-tauri
        run: |
          cargo check --verbose
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust Unit Tests
        working-directory: launcher/src-tauri
        run: cargo test --verbose
